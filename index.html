<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e"><meta name="description" content="RS Chatrabash personal mess monitoring app for managing borders, monthly room rent, payments, dues, advances, deposits and payment history.">
<meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="RS Chatrabash">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png" type="image/png"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon-192.png">
<title>RS Chatrabash</title>
<style>
:root{--primary:#0f766e;--primary2:#115e59;--bg:#f5f7f8;--card:#fff;--text:#17202a;--muted:#64748b;--danger:#b91c1c;--dangerbg:#fee2e2;--success:#166534;--successbg:#dcfce7;--border:#e2e8f0;--shadow:0 4px 18px #0f172a12}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif;background:var(--bg);color:var(--text);padding-bottom:78px}button,input,select{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;background:var(--primary);color:#fff;padding:15px 16px;box-shadow:0 2px 10px #0002}.top h1{margin:0;font-size:20px}.top small{opacity:.85}.container{max-width:900px;margin:auto;padding:16px}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{background:var(--card);padding:14px;border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--border)}.stat b{font-size:22px;display:block}.stat span{font-size:12px;color:var(--muted)}.section{margin-top:18px}.section h2{font-size:17px;margin:0 0 10px}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;box-shadow:var(--shadow);margin-bottom:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.name{font-weight:700;font-size:16px}.muted{color:var(--muted);font-size:13px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700}.due{background:var(--dangerbg);color:var(--danger)}.advance{background:var(--successbg);color:var(--success)}.paid{background:#e0f2fe;color:#075985}.btn{border:0;border-radius:10px;padding:10px 13px;background:var(--primary);color:#fff;font-weight:700}.btn.secondary{background:#e2e8f0;color:#0f172a}.btn.danger{background:#fee2e2;color:#991b1b}.btn.small{padding:7px 9px;font-size:12px}.search{width:100%;padding:12px;border:1px solid var(--border);border-radius:11px;background:#fff}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);z-index:30;display:flex;justify-content:center}.nav{width:min(900px,100%);display:grid;grid-template-columns:repeat(5,1fr)}.nav button{border:0;background:#fff;padding:9px 3px;color:var(--muted);font-size:11px}.nav button.active{color:var(--primary);font-weight:800}.nav strong{display:block;font-size:17px}.tablewrap{overflow:auto;background:#fff;border:1px solid var(--border);border-radius:12px}.table{border-collapse:collapse;width:100%;min-width:720px}.table th,.table td{padding:9px;border-bottom:1px solid var(--border);text-align:right;font-size:12px;white-space:nowrap}.table th:first-child,.table td:first-child{text-align:left}.table th{background:#f1f5f9}.modal{position:fixed;inset:0;background:#0008;z-index:50;display:none;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{background:#fff;width:min(900px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:#475569}.field input,.field select{width:100%;padding:11px;border:1px solid var(--border);border-radius:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:15px;flex-wrap:wrap}.profileHead{display:flex;align-items:center;gap:12px}.avatar{width:54px;height:54px;border-radius:50%;background:#ccfbf1;color:var(--primary2);display:grid;place-items:center;font-size:21px;font-weight:800}.empty{padding:25px;text-align:center;color:var(--muted)}.dangerText{color:var(--danger);font-weight:800}.successText{color:var(--success);font-weight:800}.toolbar{display:flex;gap:8px;margin-bottom:12px}.toolbar>*{flex:1}.monthbar{display:flex;gap:7px;overflow:auto;padding-bottom:6px}.monthbar button{white-space:nowrap}.hidden{display:none!important}.footerNote{font-size:11px;color:var(--muted);text-align:center;margin:20px 0}
@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}.modal{align-items:center}.sheet{border-radius:20px;max-height:88vh}.container{padding:22px}.nav button{font-size:12px}}
</style></head>
<body>
<header class="top"><h1>RS Chatrabash</h1><small>মেস মনিটরিং ও ভাড়া ব্যবস্থাপনা</small></header>
<main class="container">
<section id="dashboard" class="view active"></section>
<section id="borders" class="view"></section>
<section id="payments" class="view"></section>
<section id="reports" class="view"></section>
<section id="settings" class="view"></section>
</main>
<nav class="bottom"><div class="nav">
<button data-view="dashboard"><strong>⌂</strong>ড্যাশবোর্ড</button><button data-view="borders"><strong>♙</strong>বর্ডার</button><button data-view="payments"><strong>৳</strong>পেমেন্ট</button><button data-view="reports"><strong>▤</strong>রিপোর্ট</button><button data-view="settings"><strong>⚙</strong>সেটিংস</button>
</div></nav>
<div id="modal" class="modal"><div id="sheet" class="sheet"></div></div>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./sw.js', { scope: './' })
      .then(function (registration) { registration.update(); })
      .catch(function (error) { console.error('Service Worker registration failed:', error); });
  });
}
</script>
<script src="app.js"></script>
</body></html>
